<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Font Awesome -->
  <link href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet" />

  <!-- Bootswatch Darkly (Bootstrap 4) -->
  <link href="https://stackpath.bootstrapcdn.com/bootswatch/4.5.2/darkly/bootstrap.min.css" rel="stylesheet" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <title>JS Todo List</title>

  <style>
    /* ── Custom Variables ─────────────────────────────── */
    :root {
      --bg:          #1a1d23;
      --surface:     #22262f;
      --surface2:    #292e38;
      --border:      #333848;
      --accent:      #4fd1c5;
      --accent-dim:  rgba(79, 209, 197, 0.12);
      --danger:      #fc8181;
      --text:        #e2e8f0;
      --text-muted:  #718096;
      --radius:      10px;
      --mono:        'Space Mono', monospace;
      --sans:        'DM Sans', sans-serif;
    }

    /* ── Base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
    }

    /* ── Navbar ───────────────────────────────────────── */
    .navbar {
      background: var(--surface) !important;
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
    }

    .navbar-brand {
      font-family: var(--mono);
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--accent) !important;
      letter-spacing: 0.05em;
    }

    .navbar-brand::before {
      content: '✓ ';
      opacity: 0.7;
    }

    /* Filters in navbar */
    #filters {
      gap: 0.5rem;
      align-items: center;
    }

    .filter-label {
      font-family: var(--mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      margin-right: 0.25rem;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 0.15rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px;
      margin-right: 0.5rem;
    }

    .filter-radio {
      display: none;
    }

    .filter-radio + label {
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
      margin: 0;
      user-select: none;
    }

    .filter-radio:checked + label {
      background: var(--accent);
      color: #1a1d23;
      font-weight: 500;
    }

    .search-input {
      background: var(--bg) !important;
      border: 1px solid var(--border) !important;
      color: var(--text) !important;
      border-radius: 6px !important;
      font-size: 0.85rem;
      padding: 5px 12px !important;
      height: auto !important;
      width: 160px;
    }

    .search-input::placeholder { color: var(--text-muted); }
    .search-input:focus {
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 2px var(--accent-dim) !important;
      outline: none;
    }

    .btn-search {
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 6px;
      padding: 5px 14px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-search:hover {
      background: var(--accent);
      color: var(--bg);
    }

    /* ── Main container ───────────────────────────────── */
    main { padding: 2rem 0; }

    /* ── Add-todo card ────────────────────────────────── */
    .add-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.75rem;
    }

    .add-card label {
      font-family: var(--mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      margin-bottom: 0.3rem;
      display: block;
    }

    .form-control-custom {
      background: var(--bg) !important;
      border: 1px solid var(--border) !important;
      color: var(--text) !important;
      border-radius: 6px !important;
      padding: 0.55rem 0.85rem;
      font-family: var(--sans);
      font-size: 0.9rem;
      transition: border-color 0.15s, box-shadow 0.15s;
      width: 100%;
    }

    .form-control-custom::placeholder { color: var(--text-muted); }
    .form-control-custom:focus {
      outline: none;
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 3px var(--accent-dim) !important;
    }

    .btn-add {
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 0.55rem 1.5rem;
      width: 100%;
      cursor: pointer;
      transition: all 0.15s;
      margin-top: 1.65rem;
    }

    .btn-add:hover {
      background: #38b2ac;
      transform: translateY(-1px);
    }

    .btn-add:active { transform: translateY(0); }

    /* ── Alert ────────────────────────────────────────── */
    #alert, #modal-alert {
      border-radius: 6px;
      font-size: 0.875rem;
      font-family: var(--sans);
      background: rgba(252, 129, 129, 0.12);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 0.6rem 1rem;
    }

    /* ── Table ────────────────────────────────────────── */
    .table-wrapper {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    #table {
      margin: 0;
      font-size: 0.9rem;
    }

    #table thead th {
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      padding: 0.85rem 1rem;
      white-space: nowrap;
    }

    #table tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.12s;
    }

    #table tbody tr:last-child { border-bottom: none; }
    #table tbody tr:hover { background: var(--surface2); }

    #table tbody td {
      padding: 0.85rem 1rem;
      vertical-align: middle;
      border: none;
      color: var(--text);
    }

    .todo-title {
      font-weight: 500;
      max-width: 200px;
    }

    .todo-desc {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .done {
      text-decoration: line-through;
      color: var(--text-muted) !important;
      opacity: 0.6;
    }

    .completed-row { opacity: 0.7; }

    /* Custom checkbox */
    .check-input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .actions-cell { white-space: nowrap; }

    .btn-edit, .btn-delete {
      border: none;
      border-radius: 5px;
      padding: 5px 9px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
      margin-left: 4px;
    }

    .btn-edit {
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid rgba(79, 209, 197, 0.25);
    }

    .btn-edit:hover {
      background: var(--accent);
      color: var(--bg);
    }

    .btn-delete {
      background: rgba(252, 129, 129, 0.1);
      color: var(--danger);
      border: 1px solid rgba(252, 129, 129, 0.25);
    }

    .btn-delete:hover {
      background: var(--danger);
      color: white;
    }

    /* Empty state */
    .empty-msg {
      text-align: center;
      color: var(--text-muted);
      padding: 3rem 1rem !important;
      font-family: var(--mono);
      font-size: 0.85rem;
    }

    .empty-msg span::before { content: '— '; }
    .empty-msg span::after  { content: ' —'; }

    /* ── Modal ────────────────────────────────────────── */
    .modal-content {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .modal-header {
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.25rem;
    }

    .modal-title {
      font-family: var(--mono);
      font-size: 0.95rem;
      letter-spacing: 0.05em;
      color: var(--accent);
    }

    .modal-body { padding: 1.25rem; }

    .modal-body label {
      font-family: var(--mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 0.3rem;
    }

    .modal-body .form-control {
      background: var(--bg) !important;
      border: 1px solid var(--border) !important;
      color: var(--text) !important;
      border-radius: 6px;
      font-family: var(--sans);
      font-size: 0.9rem;
    }

    .modal-body .form-control:focus {
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 3px var(--accent-dim) !important;
    }

    .modal-footer {
      border-top: 1px solid var(--border);
      padding: 0.85rem 1.25rem;
      gap: 0.5rem;
    }

    .modal-footer .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 0.8rem;
    }

    .modal-footer .btn-secondary:hover {
      border-color: var(--text-muted);
      color: var(--text);
    }

    #modal-btn {
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.45rem 1.2rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    #modal-btn:hover { background: #38b2ac; }

    .modal-body .form-check-label {
      font-size: 0.85rem;
      font-family: var(--sans);
      text-transform: none;
      letter-spacing: 0;
      color: var(--text);
    }

    .close {
      color: var(--text-muted) !important;
      opacity: 1;
      font-size: 1.2rem;
    }

    .close:hover { color: var(--text) !important; }

    /* ── Section header ───────────────────────────────── */
    .section-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .section-header h2 {
      font-family: var(--mono);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--text-muted);
      margin: 0;
    }

    .section-header .count-badge {
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid rgba(79, 209, 197, 0.3);
      border-radius: 20px;
      padding: 1px 10px;
      font-family: var(--mono);
      font-size: 0.75rem;
    }
  </style>
</head>
<body>

<!-- ── Navbar ──────────────────────────────────────────────────── -->
<nav class="navbar navbar-expand-lg navbar-dark">
  <a class="navbar-brand" href="#">JS Todo List</a>

  <button
    class="navbar-toggler"
    type="button"
    data-toggle="collapse"
    data-target="#navbarContent"
    aria-controls="navbarContent"
    aria-expanded="false"
    aria-label="Toggle navigation"
  >
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="navbarContent">
    <form class="form-inline ml-auto" id="filters">
      <span class="filter-label mr-2">Filtros</span>

      <div class="filter-group">
        <input type="radio" id="f-all" class="filter-radio" name="type" value="all" checked>
        <label for="f-all">Todos</label>

        <input type="radio" id="f-completed" class="filter-radio" name="type" value="completed">
        <label for="f-completed">Completados</label>

        <input type="radio" id="f-uncompleted" class="filter-radio" name="type" value="uncompleted">
        <label for="f-uncompleted">Pendientes</label>
      </div>

      <input
        class="search-input mr-2"
        type="search"
        name="words"
        placeholder="Buscar…"
        aria-label="Search"
      />

      <button class="btn-search" type="submit" id="search">
        <i class="fa fa-search mr-1"></i> Buscar
      </button>
    </form>
  </div>
</nav>

<!-- ── Modal (editar) ──────────────────────────────────────────── -->
<div
  class="modal fade"
  id="modal"
  tabindex="-1"
  role="dialog"
  aria-labelledby="modalTitle"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">✏ Editar Tarea</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>

      <div class="modal-body">
        <div class="alert d-none" role="alert" id="modal-alert"></div>

        <div class="form-group">
          <label>Título</label>
          <input id="modal-title" type="text" class="form-control" placeholder="Título de la tarea" />
        </div>

        <div class="form-group">
          <label>Descripción</label>
          <textarea class="form-control" id="modal-description" rows="3" placeholder="Descripción…"></textarea>
        </div>

        <div class="form-group form-check mt-3">
          <input id="modal-completed" type="checkbox" class="form-check-input" />
          <label class="form-check-label" for="modal-completed">Marcar como completada</label>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
        <button type="button" id="modal-btn">Guardar cambios</button>
      </div>
    </div>
  </div>
</div>

<!-- ── Main ────────────────────────────────────────────────────── -->
<main>
  <div class="container pt-2">

    <!-- Alert -->
    <div class="alert d-none mb-3" role="alert" id="alert"></div>

    <!-- Add todo card -->
    <div class="add-card">
      <div class="row align-items-end">
        <div class="col-sm-4 mb-2 mb-sm-0">
          <label for="title">Título</label>
          <input
            type="text"
            id="title"
            class="form-control-custom"
            placeholder="Ej. Aprender JavaScript"
          />
        </div>
        <div class="col-sm-6 mb-2 mb-sm-0">
          <label for="description">Descripción</label>
          <input
            type="text"
            id="description"
            class="form-control-custom"
            placeholder="Ej. Ver tutoriales de JS en YouTube"
          />
        </div>
        <div class="col-sm-2">
          <button type="button" class="btn-add" id="add">
            <i class="fa fa-plus mr-1"></i> Agregar
          </button>
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="section-header">
      <h2>Tareas</h2>
    </div>

    <div class="table-wrapper">
      <table class="table" id="table">
        <thead>
          <tr>
            <th>Título</th>
            <th>Descripción</th>
            <th class="text-center">Completada</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <!-- JS genera el contenido -->
        </tbody>
      </table>
    </div>

  </div>
</main>

<!-- jQuery -->
<script
  src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
  integrity="sha256-4+XzXVhsDmqanXGHaHvgh1gMQKX40OUvDEBTu8JcmNs="
  crossorigin="anonymous"
></script>

<!-- Bootstrap JS -->
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>

<!-- App -->
<script src="js/index.js" type="module"></script>

</body>
</html>
